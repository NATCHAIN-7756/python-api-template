# Docker Compose - Production with Load Balancing
# SCALE OS v10.0
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.8"

services:
  # ============ Nginx Load Balancer ============
  nginx:
    image: nginx:alpine
    container_name: python-api-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-1
      - api-2
      - api-3
    networks:
      - app-network

  # ============ API Containers (3 replicas) ============
  api-1:
    build:
      context: .
      target: production
    container_name: python-api-1
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD}@db-primary:5432/appdb
      - SECRET_KEY=${SECRET_KEY}
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - shared_uploads:/app/uploads
    depends_on:
      db-primary:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-2:
    build:
      context: .
      target: production
    container_name: python-api-2
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD}@db-primary:5432/appdb
      - SECRET_KEY=${SECRET_KEY}
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - shared_uploads:/app/uploads
    depends_on:
      db-primary:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-3:
    build:
      context: .
      target: production
    container_name: python-api-3
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD}@db-primary:5432/appdb
      - SECRET_KEY=${SECRET_KEY}
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - shared_uploads:/app/uploads
    depends_on:
      db-primary:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ Primary Database ============
  db-primary:
    image: postgres:15-alpine
    container_name: python-api-db-primary
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=appdb
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Redis (Session/Cache) ============
  redis:
    image: redis:7-alpine
    container_name: python-api-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    networks:
      - app-network

volumes:
  postgres_primary_data:
  shared_uploads:
  redis_prod_data:

networks:
  app-network:
    driver: bridge